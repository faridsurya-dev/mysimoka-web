server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml model/stl application/octet-stream;

    # Any `add_header` inside a location drops all of these for that location,
    # so caching below is set with `expires` only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Android APK, mounted from the host (deploy/downloads, not in git or the image).
    # No SPA fallback: a missing file must 404, not return index.html.
    location ^~ /download/ {
        types { }
        default_type application/vnd.android.package-archive;
        gzip off;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.stl$ {
        types { }
        default_type model/stl;
        expires 7d;
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
