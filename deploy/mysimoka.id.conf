# Server block for the `nginx` reverse-proxy container on 103.193.178.249.
#
# Host path: /home/rentalize/app/nginx/conf.d/mysimoka.id.conf
# Apply:     docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# TLS: webroot lineage. The ACME webroot lives inside the already-mounted
# /etc/letsencrypt (host: /home/rentalize/app/nginx/letsencrypt/webroot), so
# issuing and renewing never needs nginx to stop. Issue the certificate before
# enabling the 443 blocks, otherwise nginx refuses to load. See DEPLOY.md.
#
# Upstream is resolved per request through Docker's DNS (127.0.0.11): the
# container IP changes on every deploy, and a static `upstream` block would
# keep pointing at the old one and return 502 until the next reload.
#
# Security headers (nosniff, X-Frame-Options, Referrer-Policy) are set by the
# app container itself; only HSTS is added here to avoid duplicate headers.

server {
    listen 80;
    listen [::]:80;
    server_name mysimoka.id www.mysimoka.id;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }

    location / {
        return 301 https://mysimoka.id$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mysimoka.id;

    ssl_certificate     /etc/letsencrypt/live/mysimoka.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysimoka.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://mysimoka.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mysimoka.id;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/mysimoka.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysimoka.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mysimoka.access.log;
    error_log  /var/log/nginx/mysimoka.error.log;

    location / {
        set $mysimoka_upstream mysimoka-web:8080;
        proxy_pass http://$mysimoka_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
