<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Smart Dashboard: school-wide growth trends and at-risk students">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17405C"/><stop offset="1" stop-color="#0F2B3F"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2D9CDB" stop-opacity="0.35"/><stop offset="1" stop-color="#2D9CDB" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#glow)"/>

  <!-- window -->
  <rect x="90" y="80" width="620" height="440" rx="22" fill="#0F2B3F" stroke="#56B3E8" stroke-width="3"/>
  <path d="M112 80h576a22 22 0 0 1 22 22v22H90v-22a22 22 0 0 1 22-22z" fill="#1E4F70"/>
  <g fill="#56B3E8"><circle cx="118" cy="102" r="6" opacity=".7"/><circle cx="138" cy="102" r="6" opacity=".45"/><circle cx="158" cy="102" r="6" opacity=".3"/></g>

  <!-- KPI tiles (last one flags at-risk) -->
  <rect x="120" y="148" width="170" height="82" rx="14" fill="#1E4F70"/>
  <rect x="315" y="148" width="170" height="82" rx="14" fill="#1E4F70"/>
  <rect x="510" y="148" width="170" height="82" rx="14" fill="#1E4F70" stroke="#FFB86B" stroke-width="2"/>
  <g fill="#BFE3F7" opacity=".5"><rect x="138" y="166" width="70" height="10" rx="5"/><rect x="333" y="166" width="70" height="10" rx="5"/><rect x="528" y="166" width="70" height="10" rx="5"/></g>
  <rect x="138" y="190" width="96" height="22" rx="6" fill="#fff"/>
  <rect x="333" y="190" width="80" height="22" rx="6" fill="#fff"/>
  <rect x="528" y="190" width="60" height="22" rx="6" fill="#FFB86B"/>
  <path d="M650 176l12 22h-24z" fill="#FFB86B"/><rect x="649" y="183" width="2" height="8" fill="#0F2B3F"/>

  <!-- growth trend bars -->
  <rect x="120" y="252" width="340" height="240" rx="14" fill="#1E4F70"/>
  <g fill="#56B3E8">
    <rect x="150" y="400" width="30" height="70" rx="6"/><rect x="196" y="370" width="30" height="100" rx="6"/>
    <rect x="242" y="340" width="30" height="130" rx="6"/><rect x="288" y="360" width="30" height="110" rx="6"/>
    <rect x="334" y="310" width="30" height="160" rx="6"/>
  </g>
  <rect x="380" y="290" width="30" height="180" rx="6" fill="#6FE3C1"/>
  <path d="M165 392L211 362 257 332 303 350 349 300 395 280" fill="none" stroke="#BFE3F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>

  <!-- status donut -->
  <rect x="480" y="252" width="200" height="240" rx="14" fill="#1E4F70"/>
  <circle cx="580" cy="350" r="62" fill="none" stroke="#1D6390" stroke-width="22"/>
  <circle cx="580" cy="350" r="62" fill="none" stroke="#6FE3C1" stroke-width="22" stroke-dasharray="292 390" transform="rotate(-90 580 350)"/>
  <circle cx="580" cy="350" r="62" fill="none" stroke="#FFB86B" stroke-width="22" stroke-dasharray="46 390" stroke-dashoffset="-292" transform="rotate(-90 580 350)"/>
  <g><circle cx="514" cy="445" r="6" fill="#6FE3C1"/><rect x="526" y="440" width="50" height="10" rx="5" fill="#BFE3F7" opacity=".6"/>
     <circle cx="600" cy="445" r="6" fill="#FFB86B"/><rect x="612" y="440" width="50" height="10" rx="5" fill="#BFE3F7" opacity=".6"/></g>
</svg>
