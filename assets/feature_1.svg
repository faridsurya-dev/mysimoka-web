<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Face Recognition: a student identified instantly on an Android phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1B3A"/><stop offset="1" stop-color="#071026"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2F63EB" stop-opacity="0.35"/><stop offset="1" stop-color="#2F63EB" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#glow)"/>

  <!-- phone -->
  <rect x="290" y="70" width="220" height="440" rx="34" fill="#0B1730" stroke="#4E7FF2" stroke-width="3"/>
  <rect x="306" y="96" width="188" height="388" rx="20" fill="#12264F"/>
  <rect x="370" y="80" width="60" height="6" rx="3" fill="#4E7FF2" opacity=".6"/>

  <!-- student -->
  <circle cx="400" cy="250" r="58" fill="#B7CEFF" opacity=".9"/>
  <path d="M322 420c10-58 42-92 78-92s68 34 78 92z" fill="#B7CEFF" opacity=".9"/>

  <!-- scan frame + face landmarks -->
  <g fill="none" stroke="#6FE3C1" stroke-width="5" stroke-linecap="round">
    <path d="M330 176v-26h26"/><path d="M470 176v-26h-26"/><path d="M330 324v26h26"/><path d="M470 324v26h-26"/>
  </g>
  <line x1="330" y1="262" x2="470" y2="262" stroke="#6FE3C1" stroke-width="2" opacity=".8"/>
  <g fill="#6FE3C1"><circle cx="378" cy="238" r="4"/><circle cx="422" cy="238" r="4"/><circle cx="400" cy="262" r="4"/><circle cx="386" cy="282" r="4"/><circle cx="414" cy="282" r="4"/></g>

  <!-- identified -->
  <g transform="translate(470 400)">
    <circle r="34" fill="#2354E6" stroke="#0B1730" stroke-width="6"/>
    <path d="M-14 0l9 10 19-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- student record card -->
  <g transform="translate(548 150)">
    <rect width="150" height="96" rx="14" fill="#12264F" stroke="#4E7FF2" stroke-width="2"/>
    <circle cx="30" cy="32" r="14" fill="#B7CEFF"/>
    <rect x="54" y="22" width="80" height="10" rx="5" fill="#fff"/>
    <rect x="54" y="38" width="56" height="8" rx="4" fill="#8792A8"/>
    <rect x="16" y="64" width="118" height="14" rx="7" fill="#1A3FBD"/>
    <rect x="16" y="64" width="84" height="14" rx="7" fill="#6FE3C1"/>
  </g>
  <g opacity=".5" fill="#4E7FF2"><rect x="110" y="330" width="120" height="14" rx="7"/><rect x="146" y="356" width="84" height="14" rx="7" opacity=".6"/></g>
</svg>
