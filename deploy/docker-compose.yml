# Production stack for mysimoka.id on 43.163.117.147.
#
#   cd deploy && ./deploy.sh
#
# Explicit project name: the default would be the directory name `deploy`,
# which is generic enough to collide with another stack on this shared server.
name: mysimoka

services:
  web:
    image: ${IMAGE:-ghcr.io/faridsurya-dev/mysimoka-web}:${IMAGE_TAG:-main}
    container_name: mysimoka-web
    restart: unless-stopped
    # APK for the landing page's download button. Upload to deploy/downloads/
    # on the server (see DEPLOY.md); it is not in git or the image.
    volumes:
      - ./downloads:/usr/share/nginx/html/download:ro
    # No published ports: the `nginx` container reaches this service as
    # http://mysimoka-web:8080 over its network.
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx_net}
