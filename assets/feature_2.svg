<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Real-time Sync: measurements from the SmartGrowth device sent to the cloud instantly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1B3A"/><stop offset="1" stop-color="#071026"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2F63EB" stop-opacity="0.35"/><stop offset="1" stop-color="#2F63EB" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#glow)"/>

  <!-- SmartGrowth stadiometer + scale -->
  <rect x="130" y="130" width="22" height="340" rx="8" fill="#4E7FF2"/>
  <g stroke="#B7CEFF" stroke-width="3" opacity=".7">
    <line x1="152" y1="170" x2="170" y2="170"/><line x1="152" y1="210" x2="164" y2="210"/><line x1="152" y1="250" x2="170" y2="250"/>
    <line x1="152" y1="290" x2="164" y2="290"/><line x1="152" y1="330" x2="170" y2="330"/><line x1="152" y1="370" x2="164" y2="370"/>
    <line x1="152" y1="410" x2="170" y2="410"/>
  </g>
  <rect x="120" y="150" width="120" height="16" rx="8" fill="#B7CEFF"/>
  <rect x="100" y="470" width="190" height="34" rx="12" fill="#12264F" stroke="#4E7FF2" stroke-width="3"/>
  <rect x="170" y="480" width="50" height="14" rx="4" fill="#6FE3C1"/>

  <!-- data packets in flight -->
  <g fill="none" stroke="#6FE3C1" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14">
    <path d="M270 330C320 330 340 300 390 300"/>
    <path d="M300 470C360 470 380 380 430 360"/>
  </g>
  <g fill="#6FE3C1"><path d="M392 292l14 8-14 8z"/><path d="M430 350l14 6-12 10z"/></g>
  <g transform="translate(300 250)"><rect width="56" height="34" rx="8" fill="#12264F" stroke="#6FE3C1" stroke-width="2"/><rect x="10" y="12" width="36" height="10" rx="5" fill="#6FE3C1"/></g>

  <!-- cloud -->
  <path d="M520 170c-44 0-70 30-70 64-38 4-60 30-60 60 0 36 28 60 64 60h170c40 0 66-28 66-62 0-32-22-56-54-60-8-38-44-62-116-62z" fill="#12264F" stroke="#4E7FF2" stroke-width="3"/>
  <g fill="#4E7FF2" opacity=".85"><rect x="470" y="252" width="150" height="14" rx="7"/><rect x="470" y="280" width="110" height="14" rx="7" opacity=".6"/></g>
  <circle cx="640" cy="287" r="20" fill="#2354E6"/>
  <path d="M631 287l6 7 13-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sync arrows -->
  <g transform="translate(560 430)" fill="none" stroke="#B7CEFF" stroke-width="5" stroke-linecap="round">
    <path d="M-30 0a30 30 0 0 1 52-20"/><path d="M30 0a30 30 0 0 1-52 20"/>
    <path d="M14-30l8 10-12 4" stroke-linejoin="round"/><path d="M-14 30l-8-10 12-4" stroke-linejoin="round"/>
  </g>
</svg>
